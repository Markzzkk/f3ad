defaults:
  - _self_
  - app: train_dinov3  # merge/extend on top of app: default

diy_name: "_pretrained"

# train / AD / demo
mode: train

data:
  batch_size: 8
  num_workers: 0
  pin_mem: true

  # mvtec | visa | mvtec3d | eyecandies
  dataset: mvtec3d

  # Root directory of the few-shot training set
  # train_rgbd_2_v2.py checks whether: dataset in data_name
  data_name: mvtec3d_2shot
  data_path: /path/to/fewshot-folder
  train_root: ${data.data_path}/${data.data_name}

  # Root directory of the original dataset corresponding to the current training dataset
  # Used for testing / reading the real defect mask pool
  # - MVTec 3D AD:   /path/to/mvtec3d_anomaly_detection
  # - EyeCandies:    /path/to/EyeCandies
  test_root: /path/to/current_raw_dataset

  # RGBD / 3D
  use_depth: true
  depth_repr: hha   # raw | hha | normal
  raw_as_single_depth: true

  # MVTec AD (2D)
  mvtec_classnames:
    - bottle
    - cable
    - capsule
    - carpet
    - grid
    - hazelnut
    - leather
    - metal_nut
    - pill
    - screw
    - tile
    - toothbrush
    - transistor
    - wood
    - zipper

  # ViSA (2D)
  visa_classnames:
    - candle
    - capsules
    - cashew
    - chewinggum
    - fryum
    - macaroni1
    - macaroni2
    - pcb1
    - pcb2
    - pcb3
    - pcb4
    - pipe_fryum

  # MVTec 3D AD
  mvtec3d_classnames:
    - bagel
    - cable_gland
    - carrot
    - cookie
    - dowel
    - foam
    - peach
    - potato
    - rope
    - tire

  # EyeCandies (example; complete or replace with your actual category names)
  eyecandies_classnames:
    - CandyCane
    - ChocolateCookie
    - ChocolatePraline
    - Confetto
    - GummyBear
    - HazelnutTruffle
    - LicoriceSandwich
    - Lollipop
    - Marshmallow
    - PeppermintCandy

  # MVTec 3D path naming
  mvtec3d_rgb_dir: rgb
  mvtec3d_depth_dir: xyz
  mvtec3d_gt_dir: gt

  # EyeCandies test parameters
  eyecandies_test_split: test_public
  eyecandies_view_idx: 0
  eyecandies_use_union_mask: true
  eyecandies_return_parts_masks: false

  # Data augmentation (keep the original FoundAD settings)
  use_hflip: true
  use_vflip: true
  use_rotate90: true
  use_color_jitter: true
  use_gray: true
  use_blur: true

# ------------------------------------------------------------------
# Unified anomaly generator configuration (CutPaste / LDM3D)
# ------------------------------------------------------------------
anomaly_synth:
  # cutpaste | ldm3d
  type: cutpaste

  cutpaste:
    color_jitter: 0.5

  ldm3d:
    enabled: true

    # ===== Model paths =====
    # Pretrained LDM3D model (Diffusers-format directory)
    model_path: /path/to/ldm3d_pretrained_model

    # (Optional) Directly specify the LoRA weights to use for this run.
    # If not provided, cross_domain_lora will be selected automatically.
    # Your LoRA fine-tuning script train_universal.py exports:
    # .../final/unet_lora.pth
    # lora_path: /path/to/final/unet_lora.pth

    # To preserve the FoundAD few-shot protocol:
    # the current training dataset uses the LoRA fine-tuned on the other dataset.
    # For example:
    #   current dataset=mvtec3d    -> use LoRA fine-tuned on eyecandies
    #   current dataset=eyecandies -> use LoRA fine-tuned on mvtec3d
    cross_domain_lora:
      mvtec3d: /path/to/lora_finetuned_on_eyecandies/final/unet_lora.pth
      eyecandies: /path/to/lora_finetuned_on_mvtec3d/final/unet_lora.pth

    # (Optional) Same-domain LoRA mapping, only for debugging
    same_domain_lora:
      mvtec3d: /path/to/lora_finetuned_on_mvtec3d/final/unet_lora.pth
      eyecandies: /path/to/lora_finetuned_on_eyecandies/final/unet_lora.pth

    # ===== Root directory of the mask pool (source of real defect masks) =====
    # Priority:
    #   mask_dataset_root > dataset_roots.<current_dataset> > data.test_root
    # mask_dataset_root: /path/to/current_raw_dataset
    dataset_roots:
      mvtec3d: /path/to/mvtec3d_anomaly_detection
      eyecandies: /path/to/EyeCandies

    # Split used when building the EyeCandies mask pool.
    # Fully black masks will be skipped automatically (enabled by default).
    eyecandies_splits_for_masks: [train, val, test_public]
    skip_empty_masks: true   # Important: avoid sending all-black EyeCandies masks into the deformation pipeline

    # ===== SDEdit sampling parameters =====
    # Note: keep the prompt as a generic description.
    # Do not specify a concrete defect type, to stay consistent with LoRA fine-tuning.
    defect_prompt: "an object with defects"
    clean_prompt: "a clean object"
    use_clean_as_negative: true

    # If null, use the current crop size from FoundAD.
    # If set to 256/384/512, generation is first performed at that size and then resampled back.
    resolution: null
    steps: 30
    strength: 0.55
    guidance: 6.0

    # ===== LoRA injection parameters =====
    lora_rank: 16
    lora_alpha: 16
    target_modules: [to_q, to_k, to_v, to_out.0]

    # ===== Inference dtype / device =====
    bf16: true
    fp16: false
    # device: cuda:0
    local_files_only: false

    # ===== Cache settings (very important to avoid repeated slow diffusion generation) =====
    cache_root: /path/to/foundad_ldm3d_cache
    cache_k: 2000               # Once the cache count for a (sample_id, defect) pair reaches cache_k, reuse cached samples first
    save_original_once: true
    save_meta: true

    # ===== Real defect mask deformation parameters =====
    use_elastic: true
    alpha: 20.0
    sigma: 6.0
    scale_min: 0.3
    scale_max: 1.0
    rotate_max: 45.0
    attempts_per_mask: 30

    # For MVTec3D: intersect the deformed mask with the object foreground
    # to avoid defects drifting into the background
    use_obj_intersection_if_possible: true
    min_coverage: 0.8

    # ===== Input normalization settings =====
    # Used for conversion between training tensors and the LDM3D pixel space
    # RGB usually uses ImageNet normalization (consistent with the FoundAD DINO pipeline)
    rgb_input_norm: imagenet   # imagenet | none
    rgb_mean: [0.485, 0.456, 0.406]
    rgb_std: [0.229, 0.224, 0.225]

    # depth_input_norm:
    #   auto  : automatically detect [0,1] or [-1,1] (recommended)
    #   none  : already in [0,1]
    #   m11   : [-1,1]
    #   zscore: restore to [0,1] by (x * depth_std + depth_mean)
    depth_input_norm: auto
    depth_mean: 0.0
    depth_std: 1.0

    # Behavior when diffusion fails: return_clean | raise
    on_failure: return_clean

optimization:
  # Keep the original FoundAD hyperparameters unchanged
  weight_decay: 1e-4
  epochs: 2000
  lr: 0.001
  lr_config: const  # const, cosine, step, cosine_warmup
  min_lr: 1e-4
  warmup_epoch: 100
  step_size: 300
  gamma: 0.1

testing:
  K_top_mvtec: 10
  K_top_visa: 6
  K_top_mvtec3d: 10
  K_top_eyecandies: 6

  score_fusion: max  # max | avg | sum | rgb | depth

  expect_fpr: 0.3
  max_steps: 200
  segmentation_vis: true

devices: [cuda:0]

dist:
  master_addr: localhost
  master_port: 40112
  backend: nccl

hydra:
  run:
    dir: .
  output_subdir: null
  job:
    chdir: false
